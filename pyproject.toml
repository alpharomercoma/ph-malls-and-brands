[project]
name = "mallscape"
version = "0.1.0"
description = "Recurring scraper + brand-presence analysis for PH mall directories (SM, Robinsons)"
readme = "README.md"
authors = [
    { name = "Alpha Romer Coma", email = "alpharomercoma@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "selectolax>=0.4.11",
    "tenacity>=9.1.4",
    "typer>=0.27.0",
]

[project.scripts]
mallscape = "mallscape.cli:app"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
